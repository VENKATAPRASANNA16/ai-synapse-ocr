services:
  mongo:
    image: mongo:7.0
    container_name: ai-synapse-mongo
    restart: always
    ports:
      - "27017:27017"
    command: ["mongod", "--bind_ip_all", "--noauth"]
    volumes:
      - mongo-data:/data/db
    networks:
      - ai-synapse-network

  redis:
    image: redis:7-alpine
    container_name: ai-synapse-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - ai-synapse-network

  backend:
    build: ./backend
    container_name: ai-synapse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Update MongoDB connection - no auth
      - MONGODB_URL=mongodb://ai-synapse-mongo:27017/ai_synapse_ocr
      - DATABASE_NAME=ai_synapse_ocr
    depends_on:
      - ai-synapse-mongo
      - ai-synapse-redis
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    networks:
      - ai-synapse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-synapse-frontend
    ports:
      - "3000:3000"  # Changed from 5000:80 to 3000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - ai-synapse-network

networks:
  ai-synapse-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data: